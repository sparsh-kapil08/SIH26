<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enforcement Portal Login — Legal Metrology Compliance Checker</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #F1F5F9;">
    <div class="national-accent-bar"></div>

    <header class="app-header">
        <a href="index.html" class="brand-container">
            <svg class="emblem-img" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14" cy="14" r="13" stroke="#FF9933" stroke-width="1.5"/>
                <circle cx="14" cy="14" r="8" stroke="#138808" stroke-width="1"/>
                <circle cx="14" cy="14" r="2.5" fill="#0056B3"/>
                <path d="M14 6v16M6 14h16M8.34 8.34l11.32 11.32M8.34 19.66L19.66 8.34" stroke="#0056B3" stroke-width="0.75"/>
            </svg>
            <div class="brand-title-stack">
                <span class="brand-title-hi">उपभोक्ता मामले विभाग</span>
                <span class="brand-title-en">Department of Consumer Affairs</span>
            </div>
        </a>
    </header>

    <div class="container-narrow">
        <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-card); padding: 28px 20px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="margin-bottom: 10px; color: var(--color-primary); display: inline-flex;">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
                </div>
                <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 4px;">
                    Official Enforcement Login
                </h2>
                <p class="text-secondary" style="font-size: 0.88rem; margin: 0;">
                    Sign in to access Legal Metrology inspection logs and AI verification tools.
                </p>
            </div>

            <!-- Quick Demo Credentials Selector -->
            <div style="background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 20px;">
                <div style="font-size: 0.8rem; font-weight: 700; color: #1E40AF; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">
                    One-Click Demo Credentials:
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button type="button" id="btnQuickOfficer" class="btn btn-sm btn-secondary-light" style="width: 100%; min-height: 40px;">
                        Inspector Rajesh
                    </button>
                    <button type="button" id="btnQuickAdmin" class="btn btn-sm btn-secondary-light" style="width: 100%; min-height: 40px;">
                        Central Admin
                    </button>
                </div>
            </div>

            <!-- Tabs: Sign In / Register -->
            <div style="display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 20px;">
                <button type="button" id="tabLogin" class="btn btn-sm" style="flex: 1; border-radius: 0; border-bottom: 2px solid var(--primary-navy); font-weight: 700; background: none;">
                    Sign In
                </button>
                <button type="button" id="tabRegister" class="btn btn-sm text-secondary" style="flex: 1; border-radius: 0; background: none;">
                    New Registration
                </button>
            </div>

            <!-- Sign In Form -->
            <form id="formLogin">
                <div class="form-group">
                    <label class="form-label">Official Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="officer@doca.gov.in" value="officer.delhi@doca.gov.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="demo1234" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Designated Role</label>
                    <select id="loginRole" class="form-control">
                        <option value="officer" selected>Enforcement Officer (Field Inspector)</option>
                        <option value="admin">Supervisor / Director (State / Central HQ)</option>
                    </select>
                </div>

                <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    Sign In to Portal →
                </button>
            </form>

            <!-- Register Form -->
            <form id="formRegister" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Full Name & Title</label>
                    <input type="text" id="regName" class="form-control" placeholder="Inspector Rajesh Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Official Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="rajesh@doca.gov.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Official Badge / ID Number</label>
                    <input type="text" id="regBadge" class="form-control" placeholder="LM-DEL-8942">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="regRole" class="form-control">
                        <option value="officer" selected>Enforcement Officer</option>
                        <option value="admin">Supervisor / Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success btn-lg" style="width: 100%; margin-top: 10px;">
                    Register Enforcement Account →
                </button>
            </form>
        </div>
    </div>

        <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
