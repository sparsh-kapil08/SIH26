<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enforcement Portal Login — Legal Metrology Compliance Checker</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #F1F5F9;">
    <div class="national-accent-bar"></div>

    <header class="app-header">
        <a href="index.html" class="brand-container">
            <svg class="emblem-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" stroke="#FF9933" stroke-width="4"/>
                <circle cx="50" cy="50" r="28" stroke="#138808" stroke-width="3"/>
                <circle cx="50" cy="50" r="8" fill="#0B2545"/>
                <path d="M50 22 L50 78 M22 50 L78 50 M30 30 L70 70 M30 70 L70 30" stroke="#0056B3" stroke-width="2"/>
            </svg>
            <div>
                <div class="brand-title">Department of Consumer Affairs</div>
            </div>
        </a>
    </header>

    <div class="container-narrow">
        <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 32px;">
            <div style="text-align: center; margin-bottom: 24px;">
                <div style="font-size: 2.5rem; margin-bottom: 8px;">⚖️</div>
                <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-navy);">
                    Official Enforcement Login
                </h2>
                <p class="text-secondary" style="font-size: 0.9rem;">
                    Sign in to access Legal Metrology inspection logs and AI verification tools.
                </p>
            </div>

            <!-- Quick Demo Credentials Selector -->
            <div style="background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius-md); padding: 16px; margin-bottom: 24px;">
                <div style="font-size: 0.85rem; font-weight: 700; color: #1E40AF; margin-bottom: 10px; text-transform: uppercase;">
                    ⚡ One-Click Hackathon Demo Login:
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button type="button" id="btnQuickOfficer" class="btn btn-sm btn-primary" style="background: #1E40AF; width: 100%;">
                        🛡️ Inspector Rajesh
                    </button>
                    <button type="button" id="btnQuickAdmin" class="btn btn-sm btn-warning" style="width: 100%;">
                        👑 Director / Admin
                    </button>
                </div>
            </div>

            <!-- Tabs: Sign In / Register -->
            <div style="display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 20px;">
                <button type="button" id="tabLogin" class="btn btn-sm" style="flex: 1; border-radius: 0; border-bottom: 2px solid var(--primary-navy); font-weight: 700; background: none;">
                    Sign In
                </button>
                <button type="button" id="tabRegister" class="btn btn-sm text-secondary" style="flex: 1; border-radius: 0; background: none;">
                    New Registration
                </button>
            </div>

            <!-- Sign In Form -->
            <form id="formLogin">
                <div class="form-group">
                    <label class="form-label">Official Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="officer@doca.gov.in" value="officer.delhi@doca.gov.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="demo1234" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Designated Role</label>
                    <select id="loginRole" class="form-control">
                        <option value="officer" selected>Enforcement Officer (Field Inspector)</option>
                        <option value="admin">Supervisor / Director (State / Central HQ)</option>
                    </select>
                </div>

                <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    Sign In to Portal →
                </button>
            </form>

            <!-- Register Form -->
            <form id="formRegister" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Full Name & Title</label>
                    <input type="text" id="regName" class="form-control" placeholder="Inspector Rajesh Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Official Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="rajesh@doca.gov.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Official Badge / ID Number</label>
                    <input type="text" id="regBadge" class="form-control" placeholder="LM-DEL-8942">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select id="regRole" class="form-control">
                        <option value="officer" selected>Enforcement Officer</option>
                        <option value="admin">Supervisor / Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success btn-lg" style="width: 100%; margin-top: 10px;">
                    Register Enforcement Account →
                </button>
            </form>
        </div>
    </div>

        <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
